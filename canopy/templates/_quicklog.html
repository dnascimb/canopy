{% from "_macros.html" import csrf %}
{% macro quicklog(form, action, group=None) %}
<form method="post" action="{{ action }}" class="quicklog">
  {{ csrf() }}
  <div class="row">
    {{ form.entry_date(class_='ql-date') }}
    {% if group %}<input type="hidden" name="group_id" value="{{ group.id }}"><input type="hidden" name="plant_id" value="0">
    {% else %}{{ form.group_id() }}<input type="hidden" name="plant_id" value="0">{% endif %}
  </div>
  <div class="ql-tasks">
    {% for value, label in form.tasks.choices %}
      <label class="chip-check"><input type="checkbox" name="tasks" value="{{ value }}"> {{ label }}</label>
    {% endfor %}
  </div>
  <div class="row">
    <input type="text" name="body" placeholder="Note (optional)" aria-label="Note" style="flex:1">
    <button class="btn primary" type="submit">Log</button>
  </div>
</form>
{% endmacro %}
